name: Build and Release Latest APK

on:
  push:
    branches:
      - develop

jobs:
  build:
    name: Build & Sign APK
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout Source Code
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: 'gradle'

      - name: Grant Execute Permission to Gradlew
        run: chmod +x gradlew

      - name: Build Release APK
        run: ./gradlew assembleRelease

      - name: Sign and Prepare APK
        env:
          SIGNING_KEY: ${{ secrets.SIGNING_KEY }}
          ALIAS: ${{ secrets.ALIAS }}
          KEY_STORE_PASSWORD: ${{ secrets.KEY_STORE_PASSWORD }}
          KEY_PASSWORD: ${{ secrets.KEY_PASSWORD }}
        run: |
          echo "Decoding keystore..."
          echo "$SIGNING_KEY" | base64 --decode > /tmp/keystore.jks

          echo "Finding apksigner..."
          APKSIGNER=$(find $ANDROID_HOME/build-tools -name apksigner | sort -V | tail -n1)
          if [ -z "$APKSIGNER" ]; then
            echo "Error: apksigner not found!"
            exit 1
          else
            echo "Using apksigner at: $APKSIGNER"

            echo "Finding unsigned APK..."
            UNSIGNED_APK=$(find app/build/outputs/apk/release -name "*.apk" | head -n1)
            if [ -z "$UNSIGNED_APK" ]; then
              echo "Error: No APK found to sign!"
              exit 1
            else
              echo "Found APK to sign: $UNSIGNED_APK"

              echo "Signing APK..."
              $APKSIGNER sign --ks /tmp/keystore.jks \
                --ks-key-alias "$ALIAS" \
                --ks-pass pass:"$KEY_STORE_PASSWORD" \
                --key-pass pass:"$KEY_PASSWORD" \
                --out app/build/outputs/apk/release/oxproxion-latest.apk \
                "$UNSIGNED_APK"

              echo "Cleaning up keystore..."
              rm -f /tmp/keystore.jks

              echo "Signing complete. Output at app/build/outputs/apk/release/oxproxion-latest.apk"
            fi
          fi

      - name: Delete existing "latest" release and tag
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          # Delete the release and its associated git tag to ensure the new one points to the latest commit
          gh release delete latest --yes --cleanup-tag || true

      - name: Create and Upload to "latest" Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create latest \
            --title "Latest Development Build" \
            --notes "Automated release of the latest APK compiled from the develop branch." \
            --target develop \
            app/build/outputs/apk/release/oxproxion-latest.apk
